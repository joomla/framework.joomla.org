name: Deployment

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  composer:
    name: Install PHP dependencies
    runs-on: ubuntu-latest
    container: joomlaprojects/docker-images:php8.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache-php
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - name: Install PHP dependencies
        if: steps.cache-php.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          composer config --global home
          composer install --no-progress

  code-style-php:
    name: Check PHP code style
    runs-on: ubuntu-latest
    container: joomlaprojects/docker-images:php8.4
    needs: [composer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - name: Check PHP code style
        env:
          PHP_CS_FIXER_IGNORE_ENV: true
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none

  phpstan:
    name: Run PHPstan
    runs-on: ubuntu-latest
    container: joomlaprojects/docker-images:php8.4
    needs: [code-style-php]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - name: Run PHPstan
        run: |
          ./vendor/bin/phpstan --error-format=github

  tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    container: joomlaprojects/docker-images:php8.4
    needs: [composer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - name: Run PHPUnit
        run: ./vendor/bin/phpunit

  deployment:
    name: Deployment to server
    runs-on: ubuntu-latest
    # Only deploy pushes to master, and only after all checks have passed
    needs: [code-style-php, phpstan, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      # Fail with a clear message instead of an error from deep inside the SSH action
      - name: Check the deployment secrets
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          KEY: ${{ secrets.KEY }}
        run: |
          missing=""
          for name in WIREGUARD_CONFIG HOST USERNAME KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing deployment secrets:$missing"
            exit 1
          fi

      - name: Install WireGuard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools

      # The server is only reachable through its WireGuard network. WIREGUARD_CONFIG is a complete wg-quick configuration
      # for the runner's peer, its AllowedIPs should only contain the tunnel network, so the rest of the job isn't routed through it.
      - name: Connect to the WireGuard network
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          sudo install -m 600 /dev/null /etc/wireguard/wg0.conf
          printf '%s\n' "$WIREGUARD_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo wg-quick up wg0

      # Only the time of the latest handshake is printed, the output of `wg show` would reveal the server's endpoint in the public log
      - name: Check that the server is reachable through the tunnel
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if nc -z -w 5 "$HOST" "${PORT:-22}"; then
              exit 0
            fi
            sleep 5
          done
          echo "Latest handshake (UNIX time, 0 = none): $(sudo wg show wg0 latest-handshakes | awk '{print $2}')"
          echo "::error::The SSH port of the server isn't reachable through the WireGuard tunnel"
          exit 1

      - name: Update server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          fingerprint: ${{ secrets.HOST_FINGERPRINT }}
          script: |
            cd /home/fwjoomla/siteData
            bin/framework update:server

      - name: Disconnect from the WireGuard network
        if: always()
        run: sudo wg-quick down wg0 || true
